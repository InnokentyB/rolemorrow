name: rolemorrow-checks
services:
  checks:
    build:
      context: .
      dockerfile: Dockerfile.checks
    platform: linux/amd64
    network_mode: none
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'
