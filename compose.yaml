name: nebius-career-search
services:
  career:
    build: .
    platform: linux/amd64
    init: true
    environment:
      PORT: '3027'
      ALLOW_LIVE: '${ALLOW_LIVE:-0}'
      NEBIUS_API_KEY: '${NEBIUS_API_KEY:-}'
      TAVILY_API_KEY: '${TAVILY_API_KEY:-}'
      NEBIUS_MODEL: '${NEBIUS_MODEL:-}'
      NEBIUS_ASSESSMENT_MODEL: '${NEBIUS_ASSESSMENT_MODEL:-}'
      LIVE_MAX_JOBS_PER_COMPANY: '${LIVE_MAX_JOBS_PER_COMPANY:-3}'
    ports:
      - '127.0.0.1:3027:3027'
    volumes:
      - career-data:/app/data
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  career-data:
